name: Fetch Showcase Events Entities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # Run at 1:00 AM ET every Monday

jobs:
  fetch-and-commit-data:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check-changes.outputs.HAS_CHANGES }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Commit and Push Changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git pull
        git add output
        git commit -m "Add data generated by the script"
        git push

  artsdata-push:
    runs-on: ubuntu-latest
    needs: fetch-and-commit-data
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          artifact: showcase-events
          publisher: "https://github.com/fjjulien#this"
          downloadUrl: "https://raw.githubusercontent.com/capacoa/showcase-events/refs/heads/main/output/showcase-events.json"
